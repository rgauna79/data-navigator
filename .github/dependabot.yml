# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
 - package-ecosystem: "devcontainers"
   directory: "/"
   schedule:
     interval: weekly
 - package-ecosystem: "npm"
   directory: "/backend"
   schedule:
     interval: weekly
   # Un solo PR para versiones menores y parches; las mayores van por separado
   groups:
     minor-and-patch:
       update-types: ["minor", "patch"]
 - package-ecosystem: "npm"
   directory: "/client-frontend"
   schedule:
     interval: weekly
   groups:
     minor-and-patch:
       update-types: ["minor", "patch"]
   ignore:
     # xlsx se instala desde el CDN de SheetJS; Dependabot no puede actualizarlo
     - dependency-name: "xlsx"
     # eslint-plugin-react todavía no soporta ESLint 10
     - dependency-name: "eslint"
       update-types: ["version-update:semver-major"]
